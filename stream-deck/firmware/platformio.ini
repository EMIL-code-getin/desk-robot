; Stream deck: 6 keys + rotary encoder on an ESP32-C3 or ESP32-C6, talks to
; the computer as a Bluetooth (BLE HID) keyboard + media controller.
;
; Uses pioarduino, the community fork of the espressif32 platform that ships
; Arduino core 3.x (the official platform stops at 2.x and has no ESP32-C6).
;
; Pick the environment that matches your board:
;   pio run -e xiao_esp32c3 -t upload       Seeed XIAO ESP32C3 (default)
;   pio run -e xiao_esp32c6 -t upload       Seeed XIAO ESP32C6
;   pio run -e esp32c6_devkitc -t upload    ESP32-C6-DevKitC-1 and clones

[platformio]
default_envs = xiao_esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_ESP32C3
    ; Serial log over the USB-C port, so GPIO21 (UART TX) is free for the LED
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_ESP32C6

[env:esp32c6_devkitc]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6_DEVKITC
