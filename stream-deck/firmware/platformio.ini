; Stream deck: 9 keys + rotary encoder + 0.96" OLED on a Seeed XIAO ESP32C3,
; talks to the computer as a Bluetooth (BLE HID) keyboard + media controller.
;
; Uses pioarduino, the community fork of the espressif32 platform that ships
; Arduino core 3.x.
;
;   pio run -t upload        build and flash
;   pio device monitor       serial log (key presses, Bluetooth, layers)

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c3
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    olikraus/U8g2@^2.35.19
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Serial log over the USB-C port; GPIO20/21 (UART RX/TX) are matrix rows
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
