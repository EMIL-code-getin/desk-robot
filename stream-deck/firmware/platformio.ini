; Stream deck: 6 keys + rotary encoder on an ESP32-C6, talks to the computer
; as a Bluetooth (BLE HID) keyboard + media controller.
;
; The ESP32-C6 is only supported by Arduino core 3.x, which the official
; "espressif32" PlatformIO platform does not ship. pioarduino is the community
; fork that does (same code as the esp32 3.x core in the Arduino IDE).
;
; Pick the environment that matches your board:
;   pio run -e xiao_esp32c6 -t upload       Seeed XIAO ESP32C6 (default)
;   pio run -e esp32c6_devkitc -t upload    ESP32-C6-DevKitC-1 and clones

[platformio]
default_envs = xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_ESP32C6

[env:esp32c6_devkitc]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6_DEVKITC
